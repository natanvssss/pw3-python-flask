{% extends 'base.html' %}
{% block content %}
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="alert alert-{{ category }}">
{{ message }}
</div>
{% endfor %}
{% endwith %}
<main>
    <h1>Bem-vindo ao The Games!</h1>
    <h3>Seu site favorito de jogos!</h3>
    <hr>
    <img src="{{url_for('static',filename='/imgs/games.png')}}" alt="The Games" style="display: block; margin-left: auto; margin-right: auto;">
</main>
{% endblock content %}
