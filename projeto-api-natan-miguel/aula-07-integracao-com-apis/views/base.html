<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <header class="main-header">
        <div class="container">
            <h1 class="h4 mb-0">Pokédex</h1>
        </div>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Navegação principal">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('home') }}">Pokédex</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home') }}">Pokémons</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}
    <!-- Aqui irá conteúdo principal do site -->
    {% endblock content %}

    <footer class="main-footer">
        <p class="mb-0">&copy; 2026 - Pokédex</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrK2Q3Zx8z8R6zjQ5xj4mC9Q4fT4M6b5nQ5bF7v3hN2n1x7v4m7Q3w7g7n7w7"
        crossorigin="anonymous"></script>
</body>

</html>
