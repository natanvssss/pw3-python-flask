{% extends 'base.html' %}
{% block content %}

<h2>Cadastro de Filmes</h2>
<form action="{{url_for('cadfilmes')}}" method="post">
    <label>Filme:</label>
    <input type="text" name="Filme" placeholder="insira o nome do filme" required class="form-control">

    <label>Tipo:</label>
    <input type="text" name="Tipo" placeholder="insira a categoria do filme" required class="form-control">

    <label>Duração:</label>
    <input type="text" name="Duração" placeholder="insira a duração filme" required class="form-control">

    <input type="submit" value="Cadastrar" class="btn btn-success">
    <input type="reset" value="Limpar" class="btn btn-danger">
</form>

<br>
<hr>
<h4>Filmes cadastrados</h4>

<table class="table table-bordered table-hover">
    <thead>

        <tr>
            <th>Filme</th>
            <th>Tipo</th>
            <th>Duração</th>
        </tr>
    </thead>
    <tbody>
        {% for game in listaFilmes %}
        <tr>
            <td>{{cad.filme}}</td>
            <td>{{cad.tipo}}</td>
            <td>{{cad.duracao}}</td>s
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock content %}










{% endblock content %}
